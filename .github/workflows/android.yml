name: Build Al-Hikam Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK Platform 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Remove legacy WebView activity left in repository
        shell: bash
        run: |
          rm -f app/src/main/java/id/sejutasantri/alhikam/MainActivity.java
          rm -f app/src/main/java/id/sejutasantri/alhikam/MainActivity.kt
          test -f app/src/main/java/id/sejutasantri/alhikam/ComposeMainActivity.kt

      - name: Verify native Activity references
        shell: bash
        run: |
          if grep -R -nE 'MainActivity\.class|class MainActivity([[:space:]:]|$)' app/src/main/java; then
            echo "ERROR: Legacy MainActivity reference remains"
            exit 1
          fi
          grep -n 'ComposeMainActivity' app/src/main/AndroidManifest.xml
          grep -n 'ComposeMainActivity.class' app/src/main/java/id/sejutasantri/alhikam/ReminderReceiver.java

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlHikamDigital-V1.1.1-Compose-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
