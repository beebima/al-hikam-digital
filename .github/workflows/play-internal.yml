name: Build Signed Play AAB (Internal Testing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UPLOAD_KEYSTORE_B64: ${{ secrets.ALHIKAM_UPLOAD_KEYSTORE_B64 }}
      ALHIKAM_UPLOAD_STORE_PASSWORD: ${{ secrets.ALHIKAM_UPLOAD_STORE_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Recover private signing key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$UPLOAD_KEYSTORE_B64" || -z "$ALHIKAM_UPLOAD_STORE_PASSWORD" ]]; then
            echo 'ERROR: Set ALHIKAM_UPLOAD_KEYSTORE_B64 and ALHIKAM_UPLOAD_STORE_PASSWORD in GitHub repository Actions secrets.' >&2
            exit 1
          fi
          umask 077
          echo "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/alhikam-upload.p12"
          echo "ALHIKAM_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/alhikam-upload.p12" >> "$GITHUB_ENV"
      - name: Build signed Android App Bundle
        run: gradle --no-daemon :app:bundleRelease
      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlHikamDigital-v1.1.1-Play-Internal-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove private signing file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/alhikam-upload.p12"
