plugins { id 'com.android.application' }
android {
    namespace 'id.sejutasantri.alhikam'
    compileSdk 36
    defaultConfig {
        applicationId 'id.sejutasantri.alhikam'
        minSdk 24
        targetSdk 36
        versionCode 15
        versionName 'v.1.1.15'
    }
    signingConfigs {
        playUpload {
            def path = System.getenv('ALHIKAM_UPLOAD_KEYSTORE_PATH')
            def password = System.getenv('ALHIKAM_UPLOAD_STORE_PASSWORD')
            if (path && password) {
                storeFile file(path)
                storePassword password
                keyAlias 'alhikam-upload'
                keyPassword password
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ALHIKAM_UPLOAD_KEYSTORE_PATH') && System.getenv('ALHIKAM_UPLOAD_STORE_PASSWORD')) {
                signingConfig signingConfigs.playUpload
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Tahap 1: SDK resmi; integrasi iklan dan transaksi menyusul setelah build teruji.
dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.work:work-runtime:2.10.5'
}
